# Runs the MihuBot self-updating runner loop in a container.
#
#   docker compose up -d --build
#
# MihuBot polls GitHub for new commits on `main` and rebuilds itself in-container
# via build-latest.sh; the runner loop applies the fresh build and relaunches.
services:
  mihubot:
    build:
      context: .
      dockerfile: Dockerfile
    image: mihubot
    container_name: mihubot
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "31000:5000"
      - "31001:5001"
    volumes:
      # General state (SQLite DBs, logs, JSON stores, current build).
      - ${MIHUBOT_DATA_VOLUME:-mihubot-data}:/data
      # StorageService file blobs, kept on a separate volume so the (potentially
      # large) file data can live on its own disk (see MIHUBOT_STORAGE_DIRECTORY
      # in the Dockerfile).
      - ${MIHUBOT_STORAGE_VOLUME:-mihubot-storage}:/storage
    # Secrets for running outside of Azure can be supplied either as a
    # credentials.json placed in the mihubot-data volume (at /data/credentials.json)
    # or as environment variables, e.g. an Azure service principal:
    # environment:
    #   - Azure__TenantId=...
    #   - Azure__ClientId=...
    #   - Azure__ClientSecret=...
    # env_file:
    #   - mihubot.env

# Either volume can be pointed at a host directory instead by setting
# MIHUBOT_DATA_VOLUME / MIHUBOT_STORAGE_VOLUME to an absolute path, e.g.
#   MIHUBOT_STORAGE_VOLUME=/mnt/bigdisk/mihubot-storage docker compose up -d
volumes:
  mihubot-data:
  mihubot-storage:
